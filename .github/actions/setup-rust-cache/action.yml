name: Setup Rust cache
description: Install the pinned Rust toolchain and restore Cargo registry and build caches for the Rust workspace (plus the Windows sandbox helper workspace on Windows).

inputs:
  cache-scope:
    description: Cache key shared by jobs that build the same Rust targets with the same profile. Jobs that pass the same scope on the same OS/arch restore one another's cache.
    required: false
    default: root
  save-cache:
    description: Save a new Cargo cache on miss. Set to false for release validation legs where cache upload can block downstream smoke jobs.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # rust-toolchain.toml pins the channel and components; `rustup show` installs
    # them up front so the cache key (which hashes `rustc -vV`) is stable.
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
        cargo --version

    - name: Select Cargo workspaces
      id: workspaces
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        {
          echo "value<<EOF"
          echo ". -> target"
          # The Windows sandbox helpers are a separate Cargo workspace that only
          # Windows jobs build (crates/cowork-win-sandbox is excluded from the root).
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then
            echo "crates/cowork-win-sandbox -> target"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # Keys on rustc version, Cargo.lock, every Cargo.toml / build.rs, and the
    # selected scope; prunes stale workspace artifacts before saving so the
    # target cache does not grow without bound across restores.
    - name: Restore Cargo caches
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-scope }}
        workspaces: ${{ steps.workspaces.outputs.value }}
        save-if: ${{ inputs.save-cache == 'true' }}
