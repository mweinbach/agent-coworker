name: CI

on:
  push:
    branches:
      - main
      - testing
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Full debuginfo makes each workspace test binary ~0.5 GB, which exhausted the
  # ubuntu-latest disk during `cargo test --workspace`. Line tables keep panic
  # backtraces readable; dependencies need none.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_PACKAGE____DEBUG: "false"

jobs:
  complexity:
    name: Complexity comparison
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head and history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Typecheck comparison code and tests
        run: >
          bunx tsc --ignoreConfig --noEmit --target ESNext --module ESNext
          --moduleResolution bundler --strict --skipLibCheck --types bun-types
          scripts/complexity.ts scripts/complexityCompare.ts
          test/complexity-report.test.ts test/complexity-comparison.test.ts
          test/complexity-comparison.integration.test.ts

      - name: Flag new and increased complexity
        env:
          COMPLEXITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run complexity:compare --base "$COMPLEXITY_BASE" --json --github > "$RUNNER_TEMP/complexity-comparison.json"

      - name: Upload complexity comparison
        uses: actions/upload-artifact@v4
        with:
          name: complexity-comparison
          path: ${{ runner.temp }}/complexity-comparison.json
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-scope: mobile
          cache-dependency-path: |
            .bun-version
            bun.lock
            package.json
            packages/*/package.json
            apps/mobile/bun.lock
            apps/mobile/package.json

      # knip resolves apps/mobile through its tsconfig (`extends: expo/tsconfig.base`
      # and the `@/*` alias); without the mobile SDK it reports false dead exports.
      - name: Install mobile dependencies
        run: bun install --cwd apps/mobile --frozen-lockfile

      - name: Check for tracked build artifacts
        run: |
          tracked_tsbuildinfo=$(git ls-files | grep -c '\.tsbuildinfo' || true)
          if [ "$tracked_tsbuildinfo" -gt 0 ]; then
            echo "Error: Found tracked .tsbuildinfo files (should be gitignored):"
            git ls-files | grep '\.tsbuildinfo'
            exit 1
          fi

      - name: Docs consistency check
        run: bun run docs:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint & format check
        run: bun run check

      - name: Dead-export check
        run: bun run knip

      - name: Windows sandbox prebuilt lock freshness (advisory)
        shell: bash
        run: |
          set -euo pipefail

          output="$(bun scripts/winSandboxPrebuilt.ts check --target x86_64-pc-windows-msvc)"
          echo "$output"
          if ! grep -q '^prebuilt-hit=true$' <<< "$output"; then
            reason="$(grep '^reason=' <<< "$output" || true)"
            echo "::warning title=Windows sandbox prebuilt lock is stale::Desktop release builds will compile crates/cowork-win-sandbox from source (${reason}). Cut a win-sandbox-v* release and commit the refreshed prebuilt.lock.json to restore fast Windows packaging."
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-scope: mobile
          cache-dependency-path: |
            .bun-version
            bun.lock
            package.json
            packages/*/package.json
            apps/mobile/bun.lock
            apps/mobile/package.json

      - name: Install mobile dependencies
        run: bun install --cwd apps/mobile --frozen-lockfile

      # The black-box rust-server suites compile and spawn the native server and
      # run real sandboxed shell tools through it; bridge continuity tests also
      # compile and execute cowork-desktop's persistence test binary.
      - name: Setup Linux sandbox
        uses: ./.github/actions/setup-linux-sandbox

      - name: Setup Linux desktop dependencies
        uses: ./.github/actions/setup-linux-desktop

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: linux-dev

      - name: Unit tests
        run: bun run test

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: clippy

      - name: Rust format check
        run: cargo fmt --all -- --check

      # Clippy type-checks every target, so a separate `cargo check` would only
      # repeat the same work.
      - name: Rust clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Every integration test file links its own binary; full debuginfo made the
      # workspace test build outgrow the runner's disk. Line tables keep panic
      # locations and backtraces readable at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The hosted image ships ~20+ GB of toolchains this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Linux sandbox
        uses: ./.github/actions/setup-linux-sandbox

      - name: Setup Linux desktop dependencies
        uses: ./.github/actions/setup-linux-desktop

      # cowork-server's desktop sidecar seam tests drive the Bun schema tooling.
      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: linux-dev

      - name: Rust workspace tests
        run: cargo test --workspace --no-fail-fast

  linux-sandbox:
    name: Linux native sandbox (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install native sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: linux-dev

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bun -e 'if (process.platform !== "linux" || process.arch !== process.env.EXPECTED_ARCH) throw new Error("Native Linux runner architecture mismatch")'

      - name: Rust sandbox, runtime, and QuickJS VM regressions
        run: cargo test -p cowork-sandbox -p cowork-env -p cowork-js-vm -p cowork-tools

      - name: Rust server Linux integration regressions
        run: >
          bun run test --
          test/rust-server.http-and-rpc.integration.test.ts
          test/rust-server.jsonrpc-turns-and-tools.integration.test.ts

  windows-smoke:
    name: Windows smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-scope: windows-smoke-${{ matrix.arch }}
          save-cache: "false"

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: windows-smoke-${{ matrix.arch }}

      - name: Rust sandbox, runtime, and QuickJS VM regressions
        run: cargo test -p cowork-sandbox -p cowork-env -p cowork-js-vm -p cowork-storage

      - name: Windows sandbox helper enforcement
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (!$vsPath) { throw "Visual Studio installation not found" }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "amd64" }
          $command = "`"$devCmd`" -arch=$arch -host_arch=$arch && cargo build --release --bins --manifest-path crates\cowork-win-sandbox\Cargo.toml"
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $binaryRoot = Join-Path (Get-Location) "crates\cowork-win-sandbox\target\release"
          $helperPath = Join-Path $binaryRoot "cowork-win-sandbox.exe"
          $setupPath = Join-Path $binaryRoot "codex-windows-sandbox-setup.exe"
          $commandRunnerPath = Join-Path $binaryRoot "codex-command-runner.exe"
          foreach ($path in @($helperPath, $setupPath, $commandRunnerPath)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing Windows sandbox binary: $path" }
          }

          $env:COWORK_WIN_SANDBOX_HELPER = $helperPath
          $env:COWORK_WIN_SANDBOX_SETUP = $setupPath
          $env:COWORK_WIN_SANDBOX_COMMAND_RUNNER = $commandRunnerPath
          $env:COWORK_WIN_SANDBOX_HELPER_SHA256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $helperPath).Hash.ToLowerInvariant()
          $env:COWORK_WIN_SANDBOX_SETUP_SHA256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $setupPath).Hash.ToLowerInvariant()
          $env:COWORK_WIN_SANDBOX_COMMAND_RUNNER_SHA256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $commandRunnerPath).Hash.ToLowerInvariant()
          $env:COWORK_WIN_SANDBOX_HOME = Join-Path $env:RUNNER_TEMP "cowork-windows-sandbox"
          $setupWorkspace = Join-Path $env:RUNNER_TEMP "cowork-windows-sandbox-setup-workspace"
          New-Item -ItemType Directory -Force -Path $setupWorkspace | Out-Null

          & $helperPath setup --sandbox-home $env:COWORK_WIN_SANDBOX_HOME --cwd $setupWorkspace --mode workspace-write --writable-root $setupWorkspace
          if ($LASTEXITCODE -ne 0) { throw "Windows sandbox setup or enforcement probe failed with exit code $LASTEXITCODE" }

          cargo test -p cowork-tools --test bash_approval_parity_tests windows_bash_uses_host_sandbox -- --exact --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          bun run test -- test/build-desktop-resources.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows path and server smoke tests
        run: >
          bun run test --
          test/workspace-path.test.ts
          test/paths.test.ts
          test/cli-entrypoint.test.ts
          test/rust-server.http-and-rpc.integration.test.ts
          test/rust-server.mobile-h3.integration.test.ts

      - name: Cross-platform task and server regressions
        run: >
          bun run test --
          test/rust-server.jsonrpc-turns-and-tools.integration.test.ts
          test/rust-server.extensions-and-office.integration.test.ts

  macos-smoke:
    name: macOS ARM64 smoke
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: macos-smoke

      - name: Rust sandbox, runtime, and QuickJS VM regressions
        run: cargo test -p cowork-sandbox -p cowork-env -p cowork-js-vm

      - name: macOS runtime and resource smoke
        run: >
          bun run test --
          test/cli-entrypoint.test.ts
          test/build-desktop-resources.test.ts

      - name: Cross-platform task and server regressions
        run: >
          bun run test --
          test/workspace-path.test.ts
          test/rust-server.http-and-rpc.integration.test.ts
          test/rust-server.jsonrpc-turns-and-tools.integration.test.ts
          test/rust-server.extensions-and-office.integration.test.ts

  remote-mcp-smoke:
    name: Remote MCP smoke
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_REMOTE_MCP_TESTS: "1"
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: linux-dev

      - name: Remote MCP smoke tests
        run: cargo test -p cowork-mcp --test remote_grep_smoke -- --nocapture

  build-smoke:
    name: Build smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-scope: linux-release

      - name: Build desktop resources
        run: bun run build:desktop-resources

      - name: Build cowork-server binary
        run: bun run build:server-binary

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-scope: mobile
          cache-dependency-path: |
            .bun-version
            bun.lock
            package.json
            packages/*/package.json
            apps/mobile/bun.lock
            apps/mobile/package.json

      - name: Install mobile dependencies
        run: bun install --cwd apps/mobile --frozen-lockfile

      - name: Mobile typecheck
        run: bun run app:mobile:typecheck

      - name: Verify Expo autolinking
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          bunx expo-modules-autolinking resolve --platform apple --json > "$RUNNER_TEMP/mobile-autolinking-ios.json"
          grep -q '"packageName":"cowork-pinned-https"' "$RUNNER_TEMP/mobile-autolinking-ios.json"
          grep -q '"CoworkPinnedHttpsModule"' "$RUNNER_TEMP/mobile-autolinking-ios.json"
          bunx expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/mobile-autolinking-android.json"
          grep -q '"packageName":"cowork-pinned-https"' "$RUNNER_TEMP/mobile-autolinking-android.json"
          grep -q '"co.weinbach.cowork.mobile.pinnedhttps.CoworkPinnedHttpsModule"' "$RUNNER_TEMP/mobile-autolinking-android.json"

      - name: Export iOS mobile bundle
        run: cd apps/mobile && bunx expo export --platform ios --output-dir "$RUNNER_TEMP/cowork-mobile-ios" --clear

      - name: Export Android mobile bundle
        run: cd apps/mobile && bunx expo export --platform android --output-dir "$RUNNER_TEMP/cowork-mobile-android" --clear
