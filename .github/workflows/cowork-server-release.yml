name: Cowork Server Release

on:
  push:
    tags:
      - "cowork-server-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cowork-server-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun
        with:
          cache-scope: mobile
          cache-dependency-path: |
            .bun-version
            bun.lock
            package.json
            apps/desktop/package.json
            packages/*/package.json
            apps/mobile/bun.lock
            apps/mobile/package.json

      - name: Install mobile dependencies
        run: bun install --cwd apps/mobile --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Docs consistency check
        run: bun run docs:check

  build:
    name: Build cowork-server (${{ matrix.label }})
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact_name: cowork-server-macos
            launcher_path: dist/cowork-server-macos/cowork-server
            zip_path: dist/cowork-server-macos.zip
          - os: windows-latest
            label: Windows x64
            artifact_name: cowork-server-windows-x64
            launcher_path: dist/cowork-server-windows-x64/cowork-server.exe
            zip_path: dist/cowork-server-windows-x64.zip
            target_platform: win32
            target_arch: x64
          - os: windows-latest
            label: Windows ARM64
            artifact_name: cowork-server-windows-arm64
            launcher_path: dist/cowork-server-windows-arm64/cowork-server.exe
            zip_path: dist/cowork-server-windows-arm64.zip
            target_platform: win32
            target_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dependencies
        uses: ./.github/actions/setup-bun

      - name: Build cowork-server binary
        env:
          COWORK_BUILD_PLATFORM: ${{ matrix.target_platform }}
          COWORK_BUILD_ARCH: ${{ matrix.target_arch }}
        run: bun run build:server-binary -- --outfile ${{ matrix.launcher_path }}

      - name: Package macOS bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          chmod +x cowork-server-macos/cowork-server
          zip -r $(basename ${{ matrix.zip_path }}) cowork-server-macos

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = Split-Path -Parent "${{ matrix.launcher_path }}"
          Compress-Archive -Path $bundleDir -DestinationPath "${{ matrix.zip_path }}" -Force

      - name: Upload cowork-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_path }}
          if-no-files-found: error
          retention-days: 14

  smoke-windows-arm64:
    name: Smoke cowork-server Windows ARM64
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Download ARM64 cowork-server artifact
        uses: actions/download-artifact@v4
        with:
          name: cowork-server-windows-arm64
          path: release-assets

      - name: Verify ARM64 cowork-server executable
        shell: pwsh
        run: |
          $zipPath = Get-ChildItem "release-assets" -Recurse -Filter "*.zip" | Select-Object -First 1
          if (-not $zipPath) {
            throw "Unable to find the Windows ARM64 cowork-server bundle zip"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "cowork-server-arm64"
          $workspace = Join-Path $env:RUNNER_TEMP "cowork-server-arm64-workspace"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "cowork-server-arm64.stdout"
          $stderrPath = Join-Path $env:RUNNER_TEMP "cowork-server-arm64.stderr"

          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null

          Expand-Archive -Path $zipPath.FullName -DestinationPath $extractDir -Force

          $launcher = Get-ChildItem $extractDir -Recurse -Filter "cowork-server.exe" | Select-Object -First 1
          if (-not $launcher) {
            throw "Unable to locate cowork-server.exe in the extracted ARM64 bundle"
          }

          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($launcher.FullName))
          try {
            $reader.BaseStream.Seek(0x3C, [System.IO.SeekOrigin]::Begin) | Out-Null
            $peHeaderOffset = $reader.ReadInt32()
            $reader.BaseStream.Seek($peHeaderOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
            $peSignature = $reader.ReadUInt32()
            $machine = $reader.ReadUInt16()
            if ($peSignature -ne 0x00004550 -or $machine -ne 0xAA64) {
              throw ("Expected an ARM64 PE executable; got signature 0x{0:X8}, machine 0x{1:X4}" -f $peSignature, $machine)
            }
          } finally {
            $reader.Dispose()
          }

          $bundleDir = $launcher.Directory.FullName
          $manifestPath = Join-Path $bundleDir "cowork-win-sandbox.sha256.json"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Standalone server bundle is missing its Windows sandbox hash manifest"
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or $manifest.rustTarget -ne "aarch64-pc-windows-msvc") {
            throw "Standalone server bundle contains the wrong Windows sandbox target"
          }
          foreach ($name in @("cowork-win-sandbox.exe", "codex-windows-sandbox-setup.exe", "codex-command-runner.exe")) {
            $helperPath = Join-Path $bundleDir $name
            if (-not (Test-Path -LiteralPath $helperPath)) {
              throw "Standalone server bundle is missing Windows sandbox helper: $name"
            }
            $expected = $manifest.files.PSObject.Properties[$name].Value
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $helperPath).Hash.ToLowerInvariant()
            if (-not $expected -or $expected -ne $actual) {
              throw "Standalone server bundle sandbox hash mismatch: $name"
            }
          }

          $env:COWORK_WIN_SANDBOX_HOME = Join-Path $env:RUNNER_TEMP "cowork-server-arm64-sandbox"
          $sandboxHelper = Join-Path $bundleDir "cowork-win-sandbox.exe"
          & $sandboxHelper setup --sandbox-home $env:COWORK_WIN_SANDBOX_HOME --cwd $workspace --mode workspace-write --writable-root $workspace
          if ($LASTEXITCODE -ne 0) {
            throw "Standalone server bundle failed the native sandbox setup and enforcement probe"
          }

          $process = Start-Process -FilePath $launcher.FullName `
            -ArgumentList "--json", "--dir", $workspace, "--port", "0" `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath

          $deadline = (Get-Date).AddSeconds(30)
          $listening = $null

          while ((Get-Date) -lt $deadline) {
            if (Test-Path $stdoutPath) {
              foreach ($line in Get-Content $stdoutPath) {
                if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
                }
                try {
                  $parsed = $line | ConvertFrom-Json
                } catch {
                  continue
                }
                if ($parsed.type -eq "server_listening") {
                  $listening = $parsed
                  break
                }
              }
            }

            if ($listening) {
              break
            }

            if ($process.HasExited) {
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }

          if (-not $listening) {
            if (Test-Path $stdoutPath) {
              Get-Content $stdoutPath -Raw | Write-Host
            }
            if (Test-Path $stderrPath) {
              Get-Content $stderrPath -Raw | Write-Host
            }
            throw "ARM64 cowork-server bundle did not emit server_listening within 30 seconds"
          }

          $listening | ConvertTo-Json -Depth 5 | Write-Host

  publish:
    name: Publish cowork-server prerelease
    if: ${{ startsWith(github.ref, 'refs/tags/cowork-server-v') }}
    needs:
      - build
      - smoke-windows-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cowork-server-*

      - name: Collect cowork-server files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          files=(release-assets/**/*.zip)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No cowork-server zip files were downloaded." >&2
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish cowork-server release
        # Pinned to an immutable commit SHA: this release-publishing job runs with
        # contents: write, so the third-party action must not be a mutable tag.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.collect.outputs.files }}
          name: cowork-server ${{ github.ref_name }}
