[workspace]
resolver = "3"
members = [
  "crates/cowork-protocol",
  "crates/cowork-config",
  "crates/cowork-storage",
  "crates/cowork-inference",
  "crates/cowork-providers",
  "crates/cowork-sandbox",
  "crates/cowork-env",
  "crates/cowork-tools",
  "crates/cowork-mcp",
  "crates/cowork-js-vm",
  "crates/cowork-harness",
  "crates/cowork-server",
  "crates/cowork-cli",
]
exclude = ["crates/cowork-win-sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
# Internal workspace crates (strict acyclic layering)
cowork-protocol = { path = "crates/cowork-protocol" }
cowork-config = { path = "crates/cowork-config" }
cowork-storage = { path = "crates/cowork-storage" }
cowork-sandbox = { path = "crates/cowork-sandbox" }
cowork-env = { path = "crates/cowork-env" }
cowork-inference = { path = "crates/cowork-inference" }
cowork-providers = { path = "crates/cowork-providers" }
cowork-js-vm = { path = "crates/cowork-js-vm" }
cowork-mcp = { path = "crates/cowork-mcp" }
cowork-tools = { path = "crates/cowork-tools" }
cowork-harness = { path = "crates/cowork-harness" }
cowork-server = { path = "crates/cowork-server" }
cowork-cli = { path = "crates/cowork-cli" }

# Core async, HTTP/WS, TLS & serialization
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
data-encoding = "2"
dirs = "6"
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
jsonschema = { version = "0.60", default-features = false }
parking_lot = "0.12"
percent-encoding = "2"
rand = "0.9"
rcgen = { version = "0.14", features = ["x509-parser"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
rustls = "0.23"
rustyline = "19"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"

# Storage, locks, runtime crypto & archives
blake3 = "1"
ed25519-dalek = "3"
flate2 = "1"
fs4 = "1"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"

# Sandboxing, search, HTML/OOXML & scripting VM
aws-credential-types = "1"
aws-sigv4 = "1"
aws-smithy-eventstream = "0.61"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
htmd = "0.5"
ignore = "0.4"
libc = "0.2"
nix = "0.31"
notify = "8"
oxc_allocator = "0.156"
oxc_ast = "0.156"
oxc_codegen = "0.156"
oxc_parser = "0.156"
oxc_semantic = "0.156"
oxc_span = "0.156"
oxc_transformer = "0.156"
quick-xml = "0.42"
rquickjs = { version = "0.14", features = ["futures", "macro", "loader"] }
scraper = { version = "0.29", default-features = false, features = ["errors"] }
similar = "3"
walkdir = "2"
