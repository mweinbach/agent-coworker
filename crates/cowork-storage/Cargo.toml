[package]
name = "cowork-storage"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false
description = "SQLite sessions.db engine (migrations 1..28), ThreadJournal, memory.sqlite, ArtifactVersionStore, and cross-process locks."

[dependencies]
chrono.workspace = true
cowork-config.workspace = true
cowork-protocol.workspace = true
hex.workspace = true
icu_collator.workspace = true
libc.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
